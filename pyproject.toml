[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "quality-profiles"
version = "0.1.0"
description = "Quality profiles for benchmarking optimization algorithms by the quality of the solutions they find."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Giovanni Fasano", email = "fasano@unive.it" },
    { name = "Christian Piermarini", email = "piermarini@diag.uniroma1.it" },
    { name = "Massimo Roma", email = "roma@diag.uniroma1.it" },
]
maintainers = [
    { name = "Christian Piermarini", email = "piermarini@diag.uniroma1.it" },
]
keywords = [
    "benchmarking",
    "optimization",
    "quality profiles",
    "solver comparison",
    "derivative-free optimization",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
interactive = ["plotly>=5.18"]
science = ["SciencePlots>=2.1"]
all = ["plotly>=5.18", "SciencePlots>=2.1"]

[project.urls]
Repository = "https://github.com/chripiermarini/QualityProfiles"
Documentation = "https://github.com/chripiermarini/QualityProfiles/tree/main/docs"
Issues = "https://github.com/chripiermarini/QualityProfiles/issues"
Paper = "https://arxiv.org/abs/2607.16798"
"MATLAB code" = "https://github.com/fasano-g/Quality-Profiles"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "nbmake>=1.5",
    "ipykernel>=6.29",
    "plotly>=5.18",
    "SciencePlots>=2.1",
]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "notebooks", "examples", "docs", "README.md", "LICENSE", "CITATION.cff", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/quality_profiles"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "-ra --strict-markers --doctest-modules"
filterwarnings = [
    "error",
    # nbmake (third party) calls asyncio APIs deprecated in Python 3.14 when it loads on Windows
    "ignore:'asyncio.WindowsSelectorEventLoopPolicy' is deprecated:DeprecationWarning",
    "ignore:'asyncio.set_event_loop_policy' is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["quality_profiles"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "SIM", "RUF", "D"]
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"examples/**" = ["D", "E501"]
"notebooks/**" = ["D", "E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["matplotlib.*", "plotly.*", "scienceplots"]
ignore_missing_imports = true
